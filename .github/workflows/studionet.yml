name: StrataGauge StudioNet proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Lint and test the contract
        run: |
          python -m pip install -r requirements-dev.txt
          genvm-lint download --version v0.2.16
          genvm-lint check contracts/strata_gauge.py
          python -m pytest tests/direct -q
      - name: Install proof tooling
        run: npm ci --no-audit --no-fund
      - name: Deploy and check live consensus
        run: npm run prove
      - name: Replay public proof
        run: npm run verify -- proofs/work/proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studionet-proof
          path: proofs/work/proof.json
